name: ocorrencias-condominio

services:
  mysql:
    build: ./docker/mysql
    image: ocorrencias-condominio/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env (veja .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ocorrencias}
      MYSQL_USER: ${MYSQL_USER:-ocorrencias}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env (veja .env.example)}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Via TCP: durante a inicialização o entrypoint sobe o mysqld sem rede, então o ping só passa com o servidor final no ar.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
